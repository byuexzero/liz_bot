# QQ 机器人配置模板 —— 本地开发回退用
#
# 首选方式是**环境变量**，不需要本文件：
#     QQ_BOT_APPID=<你的 AppID>
#     QQ_BOT_SECRET=<你的 AppSecret>
#
# 部署到云平台（如 Render）时只设环境变量即可；仓库里不含 config.yaml，
# run.py 的 YAML 回退会自动跳过，不会报错。
#
# 若本地想沿用 YAML，复制后填入真实值：
#     cp liz_bot/config/config.example.yaml liz_bot/config/config.yaml
# 注意优先级：**环境变量 > 本文件**。只有当环境变量缺少某个字段时，
# 才会用本文件里对应的值补齐。
#
# 真实 config.yaml 已在 .gitignore 中，不会入库。
# appid / secret 来自 QQ 开放平台（https://q.qq.com/）的机器人管理页。

appid: ""
secret: ""
