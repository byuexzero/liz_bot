# =============================================================================
# 舞萌 DX QQ 群机器人 —— Docker Compose 配置
#
# 面向「自己管操作系统的 VPS」：腾讯云轻量应用服务器 / 阿里云 ECS 等。
# 托管容器平台（Sealos 等）用不到这个文件 —— 它们有自己的控制台，
# 直接吃仓库根目录的 Dockerfile 就行。
#
# 部署步骤与规格推算见 DEPLOY_CN.md §3.6。
#
# 用法（在**仓库根目录**执行）：
#     cp deploy/.env.example deploy/.env   # 然后填 AppID / AppSecret
#     docker compose -f deploy/docker-compose.yml up -d --build
#     docker compose -f deploy/docker-compose.yml logs -f
#
# 首次构建若卡在 apt-get update：见 DEPLOY_CN.md §3.6 的「镜像加速」小节，
# 加一个 --build-arg APT_MIRROR=mirrors.cloud.tencent.com 即可。
# =============================================================================

services:
  liz-bot:
    build:
      # compose 文件在 deploy/ 里，构建上下文要指回仓库根目录。
      context: ..
      dockerfile: Dockerfile
      args:
        # 构建期的 apt 源主机名。留空 = 沿用基础镜像自带的 Debian 官方源。
        #
        # 国内构建时 build-essential 要从 deb.debian.org 拉约 200MB，
        # 可能慢到几十分钟。在 deploy/.env 里加一行即可永久生效：
        #
        #     APT_MIRROR=mirrors.cloud.tencent.com
        #
        # 写成 args 而不是每次敲 --build-arg 的原因：`docker compose up -d
        # --build` 会**不带**参数重新构建，把 --build-arg 的成果悄悄冲掉 ——
        # 这个坑踩过。放进 compose 就不会漏。
        APT_MIRROR: ${APT_MIRROR:-}
        # 构建期的 PyPI 索引。留空 = pip 默认的 pypi.org。
        # apt 拉完 200MB 紧接着就是 pip 装约 40MB 的 wheel，同样值得换源：
        #
        #     PIP_INDEX=https://mirrors.cloud.tencent.com/pypi/simple
        #
        # 只影响下载速度，不影响装出来的东西（同样的版本约束）。
        PIP_INDEX: ${PIP_INDEX:-}
    image: liz-bot:latest
    container_name: liz-bot

    # 凭据从文件读，不写死在 compose 里 —— 这个文件是要进 git 的，
    # 凭据不能进 git（deploy/.env 已被 .gitignore 排除）。
    env_file:
      - ./.env

    environment:
      TZ: Asia/Shanghai
      # 日志与会话历史的落点。必须和下面的 volumes 保持一致，
      # 改了一处忘了另一处 = 日志静默写进容器层、重启就没。
      LIZ_DATA_DIR: /data
      # 让进程监听一个端口，供下面的 healthcheck 探活。
      HEALTHZ_PORT: "8080"

    # 用 bind mount 而不是 named volume：出问题时可以直接 ls / tar 这个目录，
    # 不用先 docker cp 出来。目录属 root（容器以 root 运行），读的时候记得 sudo。
    volumes:
      - ./data:/data

    # 只绑宿主机回环，**不开公网端口**。
    #
    # 这个机器人是纯出站的 WebSocket 客户端（只连 api.sgroup.qq.com），
    # 本身不需要任何公网入站；健康检查在容器内部自己 curl 自己，
    # 也不依赖这个映射。绑到 127.0.0.1 的唯一好处是你 SSH 上去之后
    # 能直接 `curl 127.0.0.1:8080` 看状态，而它同时**不需要在安全组开端口**。
    ports:
      - "127.0.0.1:8080:8080"

    # 实测峰值 47.5 MB（见 DEPLOY_CN.md §0.1），给 256 MB 是 5 倍余量。
    #
    # 为什么还是要设：不设限的话，将来某次内存泄漏会先吃光这台 2G 机器，
    # 连 Docker 守护进程本身都会被 OOM 拖死，症状是「整台机器 SSH 都卡」，
    # 比「容器自己被杀掉重启」难排查得多。
    mem_limit: 256m

    # Docker 的 json-file 日志驱动默认**不轮转**，会一直长到撑爆磁盘。
    # botpy 在 import 时就给 root logger 挂了 StreamHandler，日志会进这里，
    # 所以这个上限不是可选项。10MB × 3 份封顶。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # 容器挂了自动拉起。用 unless-stopped 而不是 always：
    # 你手动 stop 之后它不会自己又爬起来（排查问题时很重要）。
    restart: unless-stopped

    # 不需要提权。容器内以 root 运行只是为了让卷可写（见 Dockerfile 注释），
    # 不代表需要额外权限 —— 这条禁止 setuid 程序再提权。
    security_opt:
      - no-new-privileges:true

    # 注意：健康检查**只用于 `docker ps` 显示状态，不会触发重启**。
    # Docker 的 restart 策略只看进程是否退出，不看 healthy / unhealthy。
    # 想在 unhealthy 时自动重启，得再挂一个 autoheal 容器 —— 本机器人用不上：
    # botpy 自带断线重连，进程在跑就说明连接在维护中。
    #
    # 探的是 healthz 的响应体而不是状态码：healthz 永远返回 200（启动阶段
    # 返回非 200 会被平台判为启动失败），真正区分状态的是 body 里的
    # "bot": "starting" / "ready"（见 liz_bot/healthz.py）。
    # 用 python 而不是 curl —— python:3.10-slim 里没有 curl。
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request as u,sys; d=json.load(u.urlopen('http://127.0.0.1:8080/',timeout=3)); sys.exit(0 if d.get('bot')=='ready' else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      # 冷启动到 on_ready 通常几秒，30s 是留够网络抖动与重连的余量。
      start_period: 30s
